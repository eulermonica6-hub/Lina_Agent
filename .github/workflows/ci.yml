name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --extra dev --locked
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: uv run --locked playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: uv run --locked playwright install chromium
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest --browser chromium --tracing=retain-on-failure --cov --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
