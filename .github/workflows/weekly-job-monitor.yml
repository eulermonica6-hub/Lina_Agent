name: Lina Weekly Job Monitor

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Run Lina weekly source monitor
        run: uv run --locked lina-monitor --output artifacts/weekly-monitor.json
      - uses: actions/upload-artifact@v4
        with:
          name: lina-weekly-monitor-${{ github.run_id }}
          path: artifacts/weekly-monitor.json
          if-no-files-found: error