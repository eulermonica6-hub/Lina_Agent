[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lina-career-agent"
version = "0.2.40"
description = "An explainable AI agent for the job-search workflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.scripts]
lina-match = "lina_agent.cli.career_match:main"
lina-monitor = "lina_agent.cli.monitor:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3,<5.0",
    "pyright>=1.1.404,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=6.2,<7.0",
    "pytest-playwright>=0.7,<1.0",
    "ruff>=0.12,<1.0",
]
inference = [
    "ninja>=1.13,<2",
    "numpy>=2,<3",
    "torch>=2.8,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lina_agent = ["web/*", "infrastructure/job_sources/*.toml"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
asyncio_mode = "strict"
markers = [
    "browser: end-to-end tests that require a Playwright browser",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["lina_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "；"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
